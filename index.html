<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing In The Deep</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  startCoins: 100,
  rounds: 3,
  hookDescentSpeed: 120,
  hookAscentSpeed: 140,
  hookFastSpeed: 300,
  gaugeSpeed: 0.85,
  surfaceY: 100,
  metersToPixels: 80,
  fishHitRadius: 28,
  hookHitRadius: 22,
  summaryFishDelay: 800,
  summaryTotalDuration: 1500,
  coinFlyDuration: 600,
};

const UPGRADES = {
  maxFish: [
    { level: 6, cost: 0 },
    { level: 7, cost: 50 },
    { level: 8, cost: 100 },
    { level: 9, cost: 200 },
    { level: 10, cost: 400 }
  ],
  maxDepth: [
    { level: 5, cost: 0 },
    { level: 10, cost: 50 },
    { level: 15, cost: 75 },
    { level: 20, cost: 150 },
    { level: 30, cost: 300 }
  ]
};

const FISH_NAMES = {
  common: ['Bluefin', 'Sardine', 'Mackerel', 'Herring', 'Anchovy', 'Minnow'],
  rare: ['Sunscale', 'Moonfish', 'Violet Fin', 'Coral Dancer', 'Ember Trout'],
  amazing: ['Golden Koi', 'Storm Eel', 'Crystal Pike', 'Phoenix Bass'],
  legendary: ['Abyssal Lord', 'Diamond Leviathan', 'Phantom Whale', 'Star Serpent']
};

const FISH_COLORS = {
  common: { body: ['#4FC3F7', '#81C784', '#AED581', '#4DD0E1'], accent: ['#0288D1', '#388E3C', '#689F38', '#00838F'] },
  rare: { body: ['#CE93D8', '#F48FB1', '#FF8A65'], accent: ['#7B1FA2', '#C2185B', '#D84315'] },
  amazing: { body: ['#FFD54F', '#FFB74D', '#FFF176'], accent: ['#F57F17', '#E65100', '#F9A825'] },
  legendary: { body: ['#E1BEE7', '#B2EBF2', '#F8BBD0'], accent: ['#4A148C', '#006064', '#880E4F'] }
};

const FISH_VALUES = {
  common: [5, 10],
  rare: [15, 25],
  amazing: [30, 50],
  legendary: [60, 100]
};

// ============================================================
// AUDIO
// ============================================================
const audio = {
  muted: false,
  started: false,
  bgm: null,
  sfxCatch: null,
  sfxCast: null,
  init() {
    if (this.started) return;
    this.started = true;
    try {
      this.bgm = new Audio('assets/background_music.mp3');
      this.bgm.loop = true;
      this.bgm.volume = 0.25;
      this.bgm.play().catch(() => {});
      this.sfxCatch = new Audio('assets/catch.mp3');
      this.sfxCatch.volume = 0.5;
      this.sfxCast = new Audio('assets/rob_use.mp3');
      this.sfxCast.volume = 0.45;
    } catch (e) {}
  },
  playSfx(type) {
    if (this.muted || !this.started) return;
    try {
      const src = type === 'catch' ? 'assets/catch.mp3' : 'assets/rob_use.mp3';
      const vol = type === 'catch' ? 0.5 : 0.45;
      const s = new Audio(src);
      s.volume = vol;
      s.play().catch(() => {});
    } catch (e) {}
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.bgm) {
      this.bgm.muted = this.muted;
    }
  }
};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CONFIG.surfaceY = Math.round(H * 0.28);
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// STATE
// ============================================================
let state = {
  phase: 'READY',
  round: 1,
  coins: CONFIG.startCoins,
  maxFishLevel: 0,
  maxDepthLevel: 0,
  selectedDepth: 0,
  caughtFish: [],
  totalEarnings: 0,
  pauseTimer: 0,
  showTutorial: false,
};

let gauge = { position: 0, direction: 1, running: true };
let hook = { x: 0, y: 0, speed: 0, targetDepth: 0 };
let camera = { y: 0 };
let fish = [];
let particles = [];
let floatingTexts = [];
let summaryState = { index: 0, timer: 0, total: 0, countUp: 0, coinFlying: false, flyTimer: 0 };
let pointerX = 0;
let nearSurface = false;

function getMaxFish() { return UPGRADES.maxFish[state.maxFishLevel].level; }
function getMaxDepth() { return UPGRADES.maxDepth[state.maxDepthLevel].level; }
function getMinDepth() { return Math.max(getMaxDepth() - 2, 3); }
function depthToWorldY(depth) { return CONFIG.surfaceY + depth * CONFIG.metersToPixels; }

// ============================================================
// INPUT
// ============================================================
// ============================================================
// DECORATIVE DATA (visual only)
// ============================================================
const clouds = [];
for (let i = 0; i < 6; i++) {
  clouds.push({
    x: Math.random() * 2000 - 500,
    y: 10 + Math.random() * 50,
    w: 80 + Math.random() * 120,
    h: 25 + Math.random() * 20,
    speed: 8 + Math.random() * 12,
    opacity: 0.4 + Math.random() * 0.3
  });
}

const bubbles = [];
for (let i = 0; i < 20; i++) {
  bubbles.push({
    x: Math.random() * 2000,
    y: Math.random() * 1500,
    size: 2 + Math.random() * 4,
    speed: 15 + Math.random() * 25,
    wobble: Math.random() * Math.PI * 2,
    opacity: 0.15 + Math.random() * 0.2
  });
}

let pointerDown = false;

canvas.addEventListener('pointerdown', (e) => {
  pointerX = e.clientX;
  pointerDown = true;
  audio.init();
  handleClick(e.clientX, e.clientY);
});

canvas.addEventListener('pointermove', (e) => {
  pointerX = e.clientX;
});

canvas.addEventListener('pointerup', () => {
  pointerDown = false;
});

function handleClick(x, y) {
  // Mute button (top-right corner, small area)
  if (x >= W - 45 && x <= W - 15 && y >= 55 && y <= 80) {
    audio.toggleMute();
    return;
  }
  if (state.phase === 'READY') {
    if (checkUpgradeClick(x, y)) return;
    if (checkPlayClick(x, y)) return;
  }
  if (state.phase === 'END_SCREEN') {
    resetGame();
  }
}

function checkUpgradeClick(x, y) {
  const btnY = H - 130;
  const btnW = 160;
  const btnH = 50;
  // Max Fish button
  const btn1X = W / 2 - 180;
  if (x >= btn1X && x <= btn1X + btnW && y >= btnY && y <= btnY + btnH) {
    buyUpgrade('maxFish');
    return true;
  }
  // Max Depth button
  const btn2X = W / 2 + 20;
  if (x >= btn2X && x <= btn2X + btnW && y >= btnY && y <= btnY + btnH) {
    buyUpgrade('maxDepth');
    return true;
  }
  return false;
}

function checkPlayClick(x, y) {
  const playBtnY = H - 60;
  const playBtnX = W / 2 - 100;
  if (x >= playBtnX && x <= playBtnX + 200 && y >= playBtnY - 30 && y <= playBtnY + 30) {
    startFishing();
    return true;
  }
  // Also allow clicking on the gauge area
  const gaugeY = H - 60;
  if (y >= gaugeY - 40 && y <= gaugeY + 40) {
    startFishing();
    return true;
  }
  return false;
}

function buyUpgrade(type) {
  const levels = UPGRADES[type];
  const currentLevel = type === 'maxFish' ? state.maxFishLevel : state.maxDepthLevel;
  if (currentLevel >= levels.length - 1) return;
  const nextCost = levels[currentLevel + 1].cost;
  if (state.coins >= nextCost) {
    state.coins -= nextCost;
    if (type === 'maxFish') state.maxFishLevel++;
    else state.maxDepthLevel++;
    audio.playSfx('cast');
  }
}

function startFishing() {
  audio.playSfx('cast');
  gauge.running = false;
  const distFromCenter = Math.abs(gauge.position - 0.5) * 2;
  state.selectedDepth = getMaxDepth() - (distFromCenter * 2);
  state.selectedDepth = Math.max(getMinDepth(), Math.min(getMaxDepth(), state.selectedDepth));
  state.caughtFish = [];
  nearSurface = false;
  hook.x = W / 2;
  hook.y = CONFIG.surfaceY;
  hook.targetDepth = depthToWorldY(state.selectedDepth);
  hook.speed = CONFIG.hookDescentSpeed;
  spawnFish();
  state.phase = 'DESCENDING';
}

// ============================================================
// FISH SPAWNING
// ============================================================
function spawnFish() {
  fish = [];
  const count = Math.max(getMaxFish() * 4, 20);
  const maxY = depthToWorldY(state.selectedDepth);
  const minY = CONFIG.surfaceY + 40;

  for (let i = 0; i < count; i++) {
    const depth = minY + (maxY - minY) * (i / count) + Math.random() * 30;
    const depthMeters = (depth - CONFIG.surfaceY) / CONFIG.metersToPixels;
    const rarity = pickRarity(depthMeters);
    const colors = FISH_COLORS[rarity];
    const bodyColor = colors.body[Math.floor(Math.random() * colors.body.length)];
    const accentColor = colors.accent[Math.floor(Math.random() * colors.accent.length)];
    const names = FISH_NAMES[rarity];
    const [minVal, maxVal] = FISH_VALUES[rarity];

    fish.push({
      x: 60 + Math.random() * (W - 120),
      y: depth,
      type: rarity,
      name: names[Math.floor(Math.random() * names.length)],
      value: minVal + Math.floor(Math.random() * (maxVal - minVal + 1)),
      size: rarity === 'legendary' ? 22 : rarity === 'amazing' ? 18 : rarity === 'rare' ? 16 : 14,
      color: bodyColor,
      accentColor: accentColor,
      swimSpeed: 30 + Math.random() * 50,
      direction: Math.random() > 0.5 ? 1 : -1,
      caught: false,
      bobOffset: Math.random() * Math.PI * 2
    });
  }
}

function pickRarity(depthMeters) {
  let roll = Math.random() * 100;
  let table;
  if (depthMeters <= 5) table = [80, 15, 4, 1];
  else if (depthMeters <= 15) table = [60, 25, 10, 5];
  else table = [40, 28, 19, 13];

  if (roll < table[3]) return 'legendary';
  if (roll < table[3] + table[2]) return 'amazing';
  if (roll < table[3] + table[2] + table[1]) return 'rare';
  return 'common';
}

// ============================================================
// PARTICLES & EFFECTS
// ============================================================
function spawnCoinBurst(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 100;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 50,
      life: 1,
      decay: 1.5 + Math.random() * 0.5,
      color: Math.random() > 0.5 ? '#FFD700' : '#FFA000',
      size: 3 + Math.random() * 3
    });
  }
}

function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1, vy: -60 });
}

// ============================================================
// UPDATE
// ============================================================
let lastTime = 0;

function update(dt) {
  updateParticles(dt);
  updateFloatingTexts(dt);

  switch (state.phase) {
    case 'READY': updateReady(dt); break;
    case 'DESCENDING': updateDescending(dt); break;
    case 'PAUSE_AT_DEPTH': updatePause(dt); break;
    case 'ASCENDING_CATCH': updateAscending(dt); break;
    case 'FAST_RETURN': updateFastReturn(dt); break;
    case 'SUMMARY_FISH': updateSummaryFish(dt); break;
    case 'SUMMARY_TOTAL': updateSummaryTotal(dt); break;
    case 'END_SCREEN': break;
  }
}

function updateReady(dt) {
  if (gauge.running) {
    gauge.position += gauge.direction * CONFIG.gaugeSpeed * dt;
    if (gauge.position >= 1) { gauge.position = 1; gauge.direction = -1; }
    if (gauge.position <= 0) { gauge.position = 0; gauge.direction = 1; }
  }
}

function updateDescending(dt) {
  hook.y += hook.speed * dt;
  const targetCamY = Math.max(0, hook.y - H * 0.35);
  camera.y += (targetCamY - camera.y) * Math.min(1, 3.0 * dt);

  if (hook.y >= hook.targetDepth) {
    hook.y = hook.targetDepth;
    state.phase = 'PAUSE_AT_DEPTH';
    state.pauseTimer = state.round === 1 ? 2.0 : 0.5 + Math.random() * 0.5;
    state.showTutorial = state.round === 1;
  }

  updateFishSwim(dt);
}

function updatePause(dt) {
  state.pauseTimer -= dt;
  if (state.pauseTimer <= 0) {
    state.showTutorial = false;
    state.phase = 'ASCENDING_CATCH';
    hook.speed = CONFIG.hookAscentSpeed;
  }
}

function updateAscending(dt) {
  hook.y -= hook.speed * dt;
  hook.x += (pointerX - hook.x) * 0.1;
  hook.x = Math.max(30, Math.min(W - 30, hook.x));
  camera.y = Math.max(0, hook.y - H * 0.4);

  checkFishCollisions();
  updateFishSwim(dt);

  if (hook.y <= CONFIG.surfaceY + 20 && !nearSurface) {
    nearSurface = true;
  }

  if (hook.y <= CONFIG.surfaceY) {
    hook.y = CONFIG.surfaceY;
    startSummary();
  }
}

function updateFastReturn(dt) {
  hook.y -= CONFIG.hookFastSpeed * dt;
  hook.x += (pointerX - hook.x) * 0.05;
  camera.y = Math.max(0, hook.y - H * 0.4);

  updateFishSwim(dt);

  if (hook.y <= CONFIG.surfaceY + 30 && !nearSurface) {
    nearSurface = true;
  }

  if (hook.y <= CONFIG.surfaceY) {
    hook.y = CONFIG.surfaceY;
    startSummary();
  }
}

function updateFishSwim(dt) {
  for (let f of fish) {
    if (f.caught) continue;
    f.x += f.swimSpeed * f.direction * dt;
    if (f.x < 40) { f.x = 40; f.direction = 1; }
    if (f.x > W - 40) { f.x = W - 40; f.direction = -1; }
  }
}

function checkFishCollisions() {
  if (state.caughtFish.length >= getMaxFish()) return;

  for (let f of fish) {
    if (f.caught) continue;
    const dx = hook.x - f.x;
    const dy = hook.y - f.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < CONFIG.fishHitRadius + f.size) {
      f.caught = true;
      state.caughtFish.push(f);
      audio.playSfx('catch');
      spawnFloatingText(f.x, f.y - camera.y, '+' + f.value, f.color);
      spawnCoinBurst(f.x, f.y - camera.y, 5);

      if (f.type !== 'common') {
        const title = f.type === 'rare' ? 'Rare!' : f.type === 'amazing' ? 'Amazing!' : 'Legendary!';
        spawnFloatingText(f.x, f.y - camera.y - 30, title, f.type === 'legendary' ? '#E1BEE7' : f.type === 'amazing' ? '#FFD54F' : '#CE93D8');
      }

      if (state.caughtFish.length >= getMaxFish()) {
        state.phase = 'FAST_RETURN';
        return;
      }
    }
  }
}

function startSummary() {
  state.phase = 'SUMMARY_FISH';
  summaryState = { index: 0, timer: 0, total: 0, countUp: 0, coinFlying: false, flyTimer: 0 };
  camera.y = 0;
  for (let f of state.caughtFish) {
    summaryState.total += f.value;
  }
}

function updateSummaryFish(dt) {
  summaryState.timer += dt * 1000;
  if (summaryState.timer >= CONFIG.summaryFishDelay) {
    summaryState.timer = 0;
    if (summaryState.index < state.caughtFish.length) {
      const f = state.caughtFish[summaryState.index];
      const py = H / 4 - 25;
      const col = summaryState.index % 3;
      const row = Math.floor(summaryState.index / 3);
      const fx = W / 2 - 105 + col * 105;
      const fy = py + 75 + row * 70;
      spawnCoinBurst(fx, fy, 4);
      spawnFloatingText(fx, fy - 30, '+' + f.value, '#FFD700');
      audio.playSfx('catch');
      summaryState.index++;
    } else {
      state.phase = 'SUMMARY_TOTAL';
      summaryState.timer = 0;
    }
  }
}

function updateSummaryTotal(dt) {
  summaryState.timer += dt * 1000;
  const progress = Math.min(1, summaryState.timer / CONFIG.summaryTotalDuration);
  summaryState.countUp = Math.floor(summaryState.total * progress);

  if (progress >= 1 && !summaryState.coinFlying) {
    summaryState.coinFlying = true;
    summaryState.flyTimer = 0;
  }

  if (summaryState.coinFlying) {
    summaryState.flyTimer += dt * 1000;
    if (summaryState.flyTimer >= CONFIG.coinFlyDuration) {
      state.coins += summaryState.total;
      state.totalEarnings += summaryState.total;

      if (state.round >= CONFIG.rounds) {
        state.phase = 'END_SCREEN';
      } else {
        state.round++;
        state.phase = 'READY';
        gauge.running = true;
        gauge.position = 0;
        gauge.direction = 1;
        nearSurface = false;
      }
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy * dt;
    t.life -= 1.2 * dt;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  switch (state.phase) {
    case 'READY': renderReady(); break;
    case 'DESCENDING':
    case 'PAUSE_AT_DEPTH':
    case 'ASCENDING_CATCH':
    case 'FAST_RETURN':
      renderFishing(); break;
    case 'SUMMARY_FISH':
    case 'SUMMARY_TOTAL':
      renderSummary(); break;
    case 'END_SCREEN': renderEndScreen(); break;
  }

  renderParticles();
  renderFloatingTexts();
  drawMuteButton();
}

function renderReady() {
  drawSky();
  drawWaterSurface(0);
  drawFisherman();
  drawCoinCounter();
  drawUpgradeButtons();
  drawGauge();
  drawRoundIndicator();
}

function renderFishing() {
  drawSky();
  drawWater(camera.y);

  const surfaceScreenY = CONFIG.surfaceY - camera.y;
  if (surfaceScreenY > -80) {
    ctx.save();
    ctx.translate(0, -camera.y);
    drawFisherman();
    ctx.restore();
  }

  drawFishInWater();
  drawHookAndLine();
  drawCaughtFishOnHook();

  if (nearSurface || state.phase === 'DESCENDING' || state.phase === 'PAUSE_AT_DEPTH' ||
      state.phase === 'ASCENDING_CATCH' || state.phase === 'FAST_RETURN') {
    if (nearSurface) {
      drawCoinCounter();
    } else {
      drawFishCounter();
    }
  }

  if (state.showTutorial) {
    drawTutorial();
  }

  drawRoundIndicator();
}

function renderSummary() {
  drawSky();
  drawWaterSurface(0);
  drawCoinCounter();
  drawRoundIndicator();

  if (state.phase === 'SUMMARY_FISH') {
    drawSummaryFish();
  } else {
    drawSummaryTotal();
  }
}

function renderEndScreen() {
  // Deep ocean background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050d1a');
  grad.addColorStop(0.3, '#0a1e3d');
  grad.addColorStop(0.7, '#0c2a52');
  grad.addColorStop(1, '#071428');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Ambient light shafts
  const et = Date.now() * 0.0003;
  ctx.save();
  for (let i = 0; i < 4; i++) {
    ctx.globalAlpha = 0.025 + Math.sin(et + i * 1.5) * 0.01;
    ctx.fillStyle = '#4FC3F7';
    ctx.beginPath();
    const rx = W * 0.15 + i * W * 0.22 + Math.sin(et * 2 + i) * 15;
    ctx.moveTo(rx, 0);
    ctx.lineTo(rx + 40, 0);
    ctx.lineTo(rx + 90, H);
    ctx.lineTo(rx - 30, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Main panel
  const px = W / 2 - 190;
  const py = H / 3 - 60;
  const pw = 380;
  const ph = 250;
  ctx.fillStyle = 'rgba(6,18,40,0.85)';
  roundRect(ctx, px, py, pw, ph, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(79,195,247,0.15)';
  ctx.lineWidth = 1;
  roundRect(ctx, px, py, pw, ph, 16);
  ctx.stroke();
  // Inner top highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.beginPath();
  ctx.moveTo(px + 20, py + 1);
  ctx.lineTo(px + pw - 20, py + 1);
  ctx.stroke();

  // Title
  ctx.save();
  ctx.shadowColor = 'rgba(255,200,50,0.4)';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 40px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over!', W / 2, py + 50);
  ctx.restore();

  // Gold divider
  const dg = ctx.createLinearGradient(px + 50, 0, px + pw - 50, 0);
  dg.addColorStop(0, 'transparent');
  dg.addColorStop(0.3, 'rgba(255,200,50,0.3)');
  dg.addColorStop(0.5, 'rgba(255,215,0,0.5)');
  dg.addColorStop(0.7, 'rgba(255,200,50,0.3)');
  dg.addColorStop(1, 'transparent');
  ctx.strokeStyle = dg;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 50, py + 70);
  ctx.lineTo(px + pw - 50, py + 70);
  ctx.stroke();

  // Final balance
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.coins + ' coins', W / 2, py + 115);
  ctx.fillStyle = 'rgba(180,200,220,0.6)';
  ctx.font = '12px Georgia, serif';
  ctx.fillText('FINAL BALANCE', W / 2, py + 135);

  // Earnings
  ctx.fillStyle = '#4FC3F7';
  ctx.font = '18px Georgia, serif';
  ctx.fillText('Fish Earnings: ' + state.totalEarnings + ' coins', W / 2, py + 175);

  // Play again prompt (pulsing)
  const pulse = 0.45 + Math.sin(Date.now() * 0.003) * 0.2;
  ctx.fillStyle = `rgba(180,220,240,${pulse})`;
  ctx.font = '15px Georgia, serif';
  ctx.fillText('Click anywhere to play again', W / 2, py + 225);

  spawnEndScreenParticles();
}

let endParticleTimer = 0;
function spawnEndScreenParticles() {
  endParticleTimer++;
  if (endParticleTimer % 20 === 0) {
    spawnCoinBurst(Math.random() * W, Math.random() * H * 0.5, 2);
  }
}

// ============================================================
// DRAW HELPERS
// ============================================================
function drawSky() {
  const skyBottom = Math.max(0, CONFIG.surfaceY - camera.y);
  if (skyBottom <= 0) return;

  const grad = ctx.createLinearGradient(0, 0, 0, skyBottom);
  grad.addColorStop(0, '#1e90ff');
  grad.addColorStop(0.3, '#62b6f5');
  grad.addColorStop(0.7, '#a8ddf7');
  grad.addColorStop(1, '#e8f8ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, skyBottom);

  // Sun
  const sunX = W * 0.78;
  const sunY = 45;
  if (sunY < skyBottom) {
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 60);
    sunGlow.addColorStop(0, 'rgba(255, 244, 180, 0.9)');
    sunGlow.addColorStop(0.3, 'rgba(255, 220, 100, 0.4)');
    sunGlow.addColorStop(0.7, 'rgba(255, 180, 50, 0.1)');
    sunGlow.addColorStop(1, 'rgba(255, 180, 50, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(sunX - 60, sunY - 60, 120, 120);

    ctx.fillStyle = '#FFF9C4';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  // Clouds
  const t = Date.now() * 0.001;
  for (let c of clouds) {
    const cx = ((c.x + c.speed * t) % (W + c.w + 200)) - c.w - 100;
    if (cx > W + 50 || c.y > skyBottom) continue;
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx, c.y, c.w * 0.5, c.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - c.w * 0.25, c.y + 4, c.w * 0.32, c.h * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + c.w * 0.28, c.y + 3, c.w * 0.35, c.h * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawWaterSurface(camY) {
  const surfaceScreenY = CONFIG.surfaceY - camY;
  const waterH = H - surfaceScreenY;

  const grad = ctx.createLinearGradient(0, surfaceScreenY, 0, H);
  grad.addColorStop(0, '#039BE5');
  grad.addColorStop(0.15, '#0277BD');
  grad.addColorStop(0.4, '#01579B');
  grad.addColorStop(0.7, '#0A2E4A');
  grad.addColorStop(1, '#061520');
  ctx.fillStyle = grad;
  ctx.fillRect(0, surfaceScreenY, W, waterH);

  // Light rays from surface
  const t = Date.now() * 0.0008;
  ctx.save();
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 5; i++) {
    const rx = W * 0.2 + i * W * 0.15 + Math.sin(t + i) * 20;
    const grad2 = ctx.createLinearGradient(rx, surfaceScreenY, rx + 30, surfaceScreenY + waterH * 0.6);
    grad2.addColorStop(0, '#fff');
    grad2.addColorStop(1, 'transparent');
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.moveTo(rx - 8, surfaceScreenY);
    ctx.lineTo(rx + 12, surfaceScreenY);
    ctx.lineTo(rx + 40, surfaceScreenY + waterH * 0.6);
    ctx.lineTo(rx - 20, surfaceScreenY + waterH * 0.6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Animated surface waves (multiple layers)
  const waveTime = Date.now() * 0.001;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = 0; x < W; x += 4) {
    const waveY = surfaceScreenY + Math.sin(x * 0.015 + waveTime * 1.8) * 3 + Math.sin(x * 0.04 + waveTime * 2.5) * 1.5;
    x === 0 ? ctx.moveTo(x, waveY) : ctx.lineTo(x, waveY);
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(200,240,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x < W; x += 4) {
    const waveY = surfaceScreenY + 5 + Math.sin(x * 0.02 + waveTime * 1.3 + 2) * 2.5;
    x === 0 ? ctx.moveTo(x, waveY) : ctx.lineTo(x, waveY);
  }
  ctx.stroke();
}

function drawWater(camY) {
  const surfaceScreenY = CONFIG.surfaceY - camY;
  const depthProgress = Math.min(1, camY / (getMaxDepth() * CONFIG.metersToPixels));

  // Water gradient — stays bright at shallow, only darkens deep
  const d = depthProgress;
  const lerpC = (c1, c2, t) => {
    const r = c1[0] + (c2[0] - c1[0]) * t;
    const g = c1[1] + (c2[1] - c1[1]) * t;
    const b = c1[2] + (c2[2] - c1[2]) * t;
    return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
  };
  const bright = [4, 170, 220];
  const mid = [2, 120, 180];
  const deep = [5, 30, 60];
  const abyss = [2, 10, 20];
  const ease = d * d;
  const topColor = lerpC(bright, mid, Math.min(1, ease * 0.8));
  const midColor = lerpC(mid, deep, Math.min(1, ease * 1.0));
  const botColor = lerpC(deep, abyss, Math.min(1, ease * 1.2));

  const grad = ctx.createLinearGradient(0, Math.max(0, surfaceScreenY), 0, H);
  grad.addColorStop(0, topColor);
  grad.addColorStop(0.4, midColor);
  grad.addColorStop(1, botColor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, Math.max(0, surfaceScreenY), W, H);

  // Sky above water (when surface is visible)
  if (surfaceScreenY > 0) {
    drawSky();
  }

  // Light rays from surface — fade out with depth
  const rayOpacity = Math.max(0, 0.07 - depthProgress * 0.06);
  if (rayOpacity > 0.005 && surfaceScreenY < H) {
    const t = Date.now() * 0.0006;
    ctx.save();
    ctx.globalAlpha = rayOpacity;
    for (let i = 0; i < 7; i++) {
      const rx = W * 0.1 + i * W * 0.13 + Math.sin(t + i * 0.8) * 30;
      const rayTop = Math.max(0, surfaceScreenY);
      const rayH = H * 0.7;
      const grad2 = ctx.createLinearGradient(rx, rayTop, rx + 20, rayTop + rayH);
      grad2.addColorStop(0, '#b3e5fc');
      grad2.addColorStop(0.6, 'rgba(100,200,255,0.3)');
      grad2.addColorStop(1, 'transparent');
      ctx.fillStyle = grad2;
      ctx.beginPath();
      ctx.moveTo(rx - 5, rayTop);
      ctx.lineTo(rx + 10, rayTop);
      ctx.lineTo(rx + 50 + i * 5, rayTop + rayH);
      ctx.lineTo(rx - 30 - i * 3, rayTop + rayH);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Caustic patterns (subtle shifting light patches)
  const causticOpacity = Math.max(0, 0.04 - depthProgress * 0.035);
  if (causticOpacity > 0.003) {
    const ct = Date.now() * 0.001;
    ctx.save();
    ctx.globalAlpha = causticOpacity;
    ctx.fillStyle = '#b3e5fc';
    for (let i = 0; i < 12; i++) {
      const cx = (Math.sin(ct * 0.7 + i * 2.1) * 0.5 + 0.5) * W;
      const cy = Math.max(surfaceScreenY + 50, 0) + (Math.cos(ct * 0.5 + i * 1.7) * 0.5 + 0.5) * H * 0.6;
      const cr = 20 + Math.sin(ct + i) * 10;
      ctx.beginPath();
      ctx.ellipse(cx, cy, cr, cr * 0.6, Math.sin(ct * 0.3 + i), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Bubbles
  const bt = Date.now() * 0.001;
  ctx.save();
  for (let b of bubbles) {
    const bx = b.x + Math.sin(bt * 1.2 + b.wobble) * 8;
    const by = ((b.y - bt * b.speed * 10) % 1200) + surfaceScreenY + 100;
    if (by < surfaceScreenY || by > H + 20) continue;
    ctx.globalAlpha = b.opacity * (1 - depthProgress * 0.5);
    ctx.strokeStyle = 'rgba(180, 230, 255, 0.6)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(bx % W, by, b.size, 0, Math.PI * 2);
    ctx.stroke();
    // Tiny highlight
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(bx % W - b.size * 0.3, by - b.size * 0.3, b.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Depth fog overlay — only at genuinely deep depths
  if (depthProgress > 0.55) {
    const fogAlpha = (depthProgress - 0.55) * 0.35;
    ctx.fillStyle = `rgba(2, 8, 18, ${fogAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Surface wave (when visible)
  if (surfaceScreenY > -10 && surfaceScreenY < H) {
    const waveTime = Date.now() * 0.001;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let x = 0; x < W; x += 4) {
      const waveY = surfaceScreenY + Math.sin(x * 0.015 + waveTime * 1.8) * 3 + Math.sin(x * 0.04 + waveTime * 2.5) * 1.5;
      x === 0 ? ctx.moveTo(x, waveY) : ctx.lineTo(x, waveY);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(200,240,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x < W; x += 4) {
      const waveY = surfaceScreenY + 5 + Math.sin(x * 0.022 + waveTime * 1.3 + 2) * 2;
      x === 0 ? ctx.moveTo(x, waveY) : ctx.lineTo(x, waveY);
    }
    ctx.stroke();
  }
}

function drawFisherman() {
  const fx = W / 2;

  // Dock shadow on water

  ctx.beginPath();
  ctx.ellipse(fx, fy + 32, 58, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dock legs
  const legG = ctx.createLinearGradient(0, fy + 20, 0, fy + 58);
  legG.addColorStop(0, '#6D4C41');
  legG.addColorStop(1, '#3E2723');
  ctx.fillStyle = legG;
  ctx.fillRect(fx - 43, fy + 22, 9, 36);
  ctx.fillRect(fx + 34, fy + 22, 9, 36);

  // Dock platform
  const dockG = ctx.createLinearGradient(0, fy + 6, 0, fy + 26);
  dockG.addColorStop(0, '#8D6E63');
  dockG.addColorStop(0.35, '#795548');
  dockG.addColorStop(0.7, '#6D4C41');

  // Plank lines
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';

  ctx.strokeStyle = 'rgba(255,255,255,0.18)';

  ctx.moveTo(fx - 50, fy + 9);

  ctx.fill();
  ctx.fillStyle = '#1565C0';
  ctx.beginPath();
  ctx.moveTo(fx + 3, fy + 2);
  ctx.lineTo(fx + 5, fy + 20);
  ctx.lineTo(fx + 15, fy + 20);

  // Smile

  ctx.lineWidth = 1;

  // Hat brim
  const brimG = ctx.createLinearGradient(fx - 18, 0, fx + 18, 0);

  ctx.fill();
  ctx.strokeStyle = '#0A3670';

  ctx.beginPath();

  // Rod shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';

  ctx.quadraticCurveTo(fx + 38, fy - 52, fx + 60, fy - 70);

  // Rod body (tapered)

  rodG.addColorStop(0, '#8D6E63');
  rodG.addColorStop(0.3, '#A1887F');
  rodG.addColorStop(0.7, '#795548');
  rodG.addColorStop(1, '#6D4C41');

  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(fx + 48, fy - 62);

  ctx.lineCap = 'butt';
}

function drawFishInWater() {
  for (let f of fish) {
    if (f.caught) continue;
    const screenY = f.y - camera.y;
    if (screenY < -50 || screenY > H + 50) continue;
    drawFish(f.x, screenY, f);
  }
}

function drawFish(x, y, f) {
  const bob = Math.sin(Date.now() * 0.003 + f.bobOffset) * 3;
  const sy = y + bob;
  const s = f.size;
  const t = Date.now() * 0.006;
  const tailWag = Math.sin(t + f.bobOffset) * 0.3;

  ctx.save();
  ctx.translate(x, sy);
  if (f.direction < 0) ctx.scale(-1, 1);

  // Rarity glow
  if (f.type === 'legendary' || f.type === 'amazing') {
    const pulse = f.type === 'legendary' ? 0.18 + Math.sin(t * 0.5) * 0.07 : 0.1;
    ctx.globalAlpha = pulse;
    const glowG = ctx.createRadialGradient(0, 0, s * 0.3, 0, 0, s * 1.8);
    glowG.addColorStop(0, f.color);
    glowG.addColorStop(1, 'transparent');
    ctx.fillStyle = glowG;
    ctx.beginPath();
    ctx.arc(0, 0, s * 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath();
  ctx.ellipse(2, 4, s * 1.05, s * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail (animated wag, forked shape)
  ctx.save();
  ctx.translate(-s + 2, 0);
  ctx.rotate(tailWag);
  ctx.fillStyle = f.accentColor;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-s * 0.35, -s * 0.45, -s * 0.55, -s * 0.4);
  ctx.quadraticCurveTo(-s * 0.3, 0, -s * 0.55, s * 0.4);
  ctx.quadraticCurveTo(-s * 0.35, s * 0.45, 0, 0);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.beginPath();
  ctx.moveTo(-1, -1);
  ctx.quadraticCurveTo(-s * 0.25, -s * 0.3, -s * 0.4, -s * 0.25);
  ctx.quadraticCurveTo(-s * 0.2, -s * 0.08, -1, -1);
  ctx.fill();
  ctx.restore();

  // Dorsal fin
  ctx.fillStyle = f.accentColor;
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, -s * 0.45);
  ctx.quadraticCurveTo(s * 0.05, -s * 0.85, s * 0.25, -s * 0.45);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.beginPath();
  ctx.moveTo(-s * 0.08, -s * 0.48);
  ctx.quadraticCurveTo(s * 0.03, -s * 0.7, s * 0.14, -s * 0.48);
  ctx.closePath();
  ctx.fill();

  // Pectoral fin
  ctx.globalAlpha = 0.65;
  ctx.fillStyle = f.accentColor;
  ctx.beginPath();
  ctx.moveTo(s * 0.05, s * 0.25);
  ctx.quadraticCurveTo(s * 0.15, s * 0.6, -s * 0.1, s * 0.5);
  ctx.quadraticCurveTo(-s * 0.05, s * 0.35, s * 0.05, s * 0.25);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Body
  const bodyG = ctx.createRadialGradient(-s * 0.15, -s * 0.15, s * 0.1, 0, 0, s);
  bodyG.addColorStop(0, f.color);
  bodyG.addColorStop(0.75, f.accentColor);
  bodyG.addColorStop(1, f.accentColor);
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = f.accentColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Belly highlight
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath();
  ctx.ellipse(-s * 0.08, s * 0.15, s * 0.55, s * 0.18, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Mouth
  ctx.strokeStyle = f.accentColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(s * 0.72, s * 0.05, s * 0.14, 0.4, Math.PI * 0.75);
  ctx.stroke();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 2;
  ctx.beginPath();
  ctx.ellipse(s * 0.4, -s * 0.1, s * 0.17, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = f.type === 'legendary' ? '#CE93D8' : f.type === 'amazing' ? '#FFD54F' : '#1a1a1a';
  ctx.beginPath();
  ctx.arc(s * 0.43, -s * 0.1, s * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(s * 0.44, -s * 0.1, s * 0.07, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(s * 0.39, -s * 0.15, s * 0.045, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawHookAndLine() {
  const hookScreenY = hook.y - camera.y;

  // Rod tip in world coords, then to screen
  const rodTipX = W / 2 + 60;
  const rodTipY = (CONFIG.surfaceY - 30) - 70;
  const rodTipScreenY = rodTipY - camera.y;

  // Anchor line to rod tip when visible, otherwise top of screen
  const lineStartX = rodTipScreenY > -20 ? rodTipX : hook.x;
  const lineStartY = Math.max(0, rodTipScreenY);

  // Line — slight catenary curve, depth-faded
  const lineDist = hookScreenY - lineStartY;
  const sag = Math.min(lineDist * 0.04, 18);
  const midX = (lineStartX + hook.x) / 2 + sag;
  const midY = (lineStartY + hookScreenY) / 2;

  const lineG = ctx.createLinearGradient(0, lineStartY, 0, hookScreenY);
  lineG.addColorStop(0, 'rgba(220,235,245,0.55)');
  lineG.addColorStop(0.5, 'rgba(200,225,240,0.4)');
  lineG.addColorStop(1, 'rgba(180,215,235,0.25)');
  ctx.strokeStyle = lineG;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(lineStartX, lineStartY);
  ctx.quadraticCurveTo(midX, midY, hook.x, hookScreenY);
  ctx.stroke();

  // Underwater glow around hook
  const depthProgress = Math.min(1, camera.y / (getMaxDepth() * CONFIG.metersToPixels));
  const glowAlpha = 0.06 + depthProgress * 0.1;
  const glowR = 25 + depthProgress * 15;
  const hookGlow = ctx.createRadialGradient(hook.x, hookScreenY + 6, 2, hook.x, hookScreenY + 6, glowR);
  hookGlow.addColorStop(0, `rgba(180,220,255,${glowAlpha})`);
  hookGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = hookGlow;
  ctx.beginPath();
  ctx.arc(hook.x, hookScreenY + 6, glowR, 0, Math.PI * 2);
  ctx.fill();

  // Hook — J-shape with metallic look
  const hx = hook.x;
  const hy = hookScreenY;

  // Shank (straight top section)
  const shankG = ctx.createLinearGradient(hx - 3, 0, hx + 3, 0);
  shankG.addColorStop(0, '#90A4AE');
  shankG.addColorStop(0.4, '#ECEFF1');
  shankG.addColorStop(0.6, '#CFD8DC');
  shankG.addColorStop(1, '#78909C');
  ctx.strokeStyle = shankG;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx, hy + 10);
  ctx.stroke();

  // Bend (curved bottom)
  const bendG = ctx.createLinearGradient(hx - 10, hy + 10, hx + 2, hy + 18);
  bendG.addColorStop(0, '#78909C');
  bendG.addColorStop(0.4, '#ECEFF1');
  bendG.addColorStop(1, '#90A4AE');
  ctx.strokeStyle = bendG;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(hx - 5, hy + 10, 5, -Math.PI * 0.5, Math.PI * 0.85, false);
  ctx.stroke();

  // Point (upward barb)
  ctx.strokeStyle = '#B0BEC5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hx - 9.3, hy + 13);
  ctx.lineTo(hx - 9, hy + 6);
  ctx.stroke();

  // Barb tick
  ctx.strokeStyle = '#CFD8DC';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx - 9, hy + 8);
  ctx.lineTo(hx - 11.5, hy + 10);
  ctx.stroke();

  // Eye ring at top of shank
  ctx.strokeStyle = '#90A4AE';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(hx, hy - 1, 2.5, 0, Math.PI * 2);
  ctx.stroke();

  // Specular highlight on bend
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(hx - 5, hy + 10, 4, -Math.PI * 0.3, Math.PI * 0.4, false);
  ctx.stroke();

  ctx.lineCap = 'butt';
}

function drawCaughtFishOnHook() {
  const hookScreenY = hook.y - camera.y;
  const count = state.caughtFish.length;
  if (count === 0) return;

  const t = Date.now() * 0.002;

  // Short connecting lines from hook bend to each fish
  for (let i = 0; i < count; i++) {
    const f = state.caughtFish[i];
    const angle = (i - (count - 1) / 2) * 0.35;
    const sway = Math.sin(t + i * 1.7) * 4;
    const hangDist = 20 + i * 14;
    const offX = hook.x + Math.sin(angle) * hangDist * 0.5 + sway;
    const offY = hookScreenY + 16 + Math.cos(angle) * hangDist;

    ctx.strokeStyle = 'rgba(200,225,240,0.25)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(hook.x, hookScreenY + 14);
    ctx.lineTo(offX, offY - f.size * 0.3);
    ctx.stroke();

    drawFish(offX, offY, f);
  }
}

function drawUpgradeBtn(x, y, w, h, label, type, level) {
  const levels = UPGRADES[type];
  const maxed = level >= levels.length - 1;
  const nextCost = maxed ? 0 : levels[level + 1].cost;
  const affordable = !maxed && state.coins >= nextCost;

  // Button body gradient
  const bg = ctx.createLinearGradient(x, y, x, y + h);
  if (affordable) {
    bg.addColorStop(0, 'rgba(46,170,80,0.85)');
    bg.addColorStop(1, 'rgba(30,120,55,0.9)');
  } else if (maxed) {
    bg.addColorStop(0, 'rgba(70,85,100,0.7)');
    bg.addColorStop(1, 'rgba(45,55,70,0.75)');
  } else {
    bg.addColorStop(0, 'rgba(150,50,50,0.7)');
    bg.addColorStop(1, 'rgba(100,30,30,0.75)');
  }
  ctx.fillStyle = bg;
  roundRect(ctx, x, y, w, h, 10);
  ctx.fill();

  // Border
  ctx.strokeStyle = affordable ? 'rgba(130,220,130,0.5)' : maxed ? 'rgba(130,140,150,0.3)' : 'rgba(200,90,90,0.4)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x, y, w, h, 10);
  ctx.stroke();

  // Top highlight edge
  ctx.strokeStyle = affordable ? 'rgba(200,255,200,0.2)' : 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + 14, y + 1.5);
  ctx.lineTo(x + w - 14, y + 1.5);
  ctx.stroke();

  // Label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + 20);

  // Info text
  ctx.font = '11px Georgia, serif';
  ctx.fillStyle = affordable ? '#C8E6C9' : 'rgba(200,210,220,0.7)';
  if (maxed) {
    ctx.fillText('MAXED (' + levels[level].level + ')', x + w / 2, y + 38);
  } else {
    const current = levels[level].level;
    const next = levels[level + 1].level;
    ctx.fillText(current + ' → ' + next + '  ·  ' + nextCost + ' coins', x + w / 2, y + 38);
  }
}

    ctx.restore();

    // Coin
    const cg = ctx.createRadialGradient(cx - 1, cy - 1, 1, cx, cy, coinSize);
    cg.addColorStop(0, '#FFF59D');
    cg.addColorStop(0.6, '#FFD700');
    cg.addColorStop(1, '#E65100');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, coinSize, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderParticles() {
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function renderFloatingTexts() {
  for (let t of floatingTexts) {
    ctx.globalAlpha = t.life;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 16px Segoe UI, Arial';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawMuteButton() {
  const bx = W - 42;
  const by = 57;
  ctx.fillStyle = 'rgba(6,18,40,0.6)';
  ctx.beginPath();
  ctx.arc(bx + 12, by + 12, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(79,195,247,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Speaker icon
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillRect(bx + 6, by + 9, 5, 6);
  ctx.beginPath();
  ctx.moveTo(bx + 11, by + 7);
  ctx.lineTo(bx + 16, by + 4);
  ctx.lineTo(bx + 16, by + 20);
  ctx.lineTo(bx + 11, by + 17);
  ctx.closePath();
  ctx.fill();
  if (audio.muted) {
    // X over speaker
    ctx.strokeStyle = '#FF5252';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx + 4, by + 4);
    ctx.lineTo(bx + 20, by + 20);
    ctx.stroke();
  } else {
    // Sound waves
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(bx + 16, by + 12, 4, -0.6, 0.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(bx + 16, by + 12, 7, -0.5, 0.5);
    ctx.stroke();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// GAME RESET
// ============================================================
function resetGame() {
  state = {
    phase: 'READY',
    round: 1,
    coins: CONFIG.startCoins,
    maxFishLevel: 0,
    maxDepthLevel: 0,
    selectedDepth: 0,
    caughtFish: [],
    totalEarnings: 0,
    pauseTimer: 0,
    showTutorial: false,
  };
  gauge = { position: 0, direction: 1, running: true };
  hook = { x: 0, y: 0, speed: 0, targetDepth: 0 };
  camera = { y: 0 };
  fish = [];
  particles = [];
  floatingTexts = [];
  nearSurface = false;
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
